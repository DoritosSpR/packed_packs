plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

subprojects {
    afterEvaluate {
        apply plugin: 'multiloader-common'

        configurations {
            commonJava {
                canBeResolved = true
            }
            commonResources {
                canBeResolved = true
            }
        }

        dependencies {
            compileOnly project(path: ":fidgetz")
            commonJava project(path: ":fidgetz", configuration: "commonJava")
            commonResources project(path: ":fidgetz", configuration: "commonResources")
        }

        compileJava {
            dependsOn(configurations.commonJava)
            source(configurations.commonJava)
        }

        processResources {
            dependsOn(configurations.commonResources)
            from(configurations.commonResources)
        }

        sourcesJar {
            dependsOn(configurations.commonJava)
            from(configurations.commonJava)
            dependsOn(configurations.commonResources)
            from(configurations.commonResources)
        }
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: "$mixin_version"
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: "$mixinextras_version"
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: "$mixinextras_version"
}

configurations {
    commonJava {
        canBeConsumed = true
        canBeResolved = false
    }
    commonResources {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
